services:
  - type: web
    name: ctrlbuild-backend
    runtime: node
    rootDir: src/backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://www.ctrl-build.my.id,https://ctrl-build.my.id
    autoDeploy: true
